name: Auto Sync Multi-Source Movies

on:
  schedule:
    # প্রতি ১২ ঘণ্টা পর পর নিজে থেকে চলবে
    - cron: '0 */4 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার বাটন

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: কোড চেকআউট করা
        uses: actions/checkout@v3

      - name: Node.js সেটআপ
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: ডিপেন্ডেন্সি ইনস্টল
        run: npm install

      - name: স্ক্র্যাপার বট রান করা
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scraper.js
